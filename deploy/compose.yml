services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - infinity-data:/data
    expose: ['8787']
    mem_limit: 768m
    cpus: 0.75
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
volumes:
  infinity-data:
  caddy-data:
  caddy-config:
