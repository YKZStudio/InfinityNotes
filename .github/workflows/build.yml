name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install cryptography
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cargo test --manifest-path native-core/Cargo.toml --locked
      - run: python tools/test_bundle_interop.py
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          WUJI_TOKEN=prototype-test-key-not-for-production python server/app.py --data "$RUNNER_TEMP/qa-data" &
          python -c "import time,urllib.request; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8787/api/health')"
          node tests/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: test-results/}
  windows:
    runs-on: windows-2022
    env:
      INFINITY_UPDATE_PUBLIC_KEY: ${{ vars.INFINITY_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: src-tauri, cache-on-failure: true}
      - run: npx tauri icon artwork/icon.svg
      - run: npx tauri build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    env:
      INFINITY_UPDATE_PUBLIC_KEY: ${{ vars.INFINITY_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-linux-android}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android init --ci --skip-targets-install
      - run: npx tauri icon artwork/icon.svg
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: src-tauri, cache-on-failure: true}
      - run: npx tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-preview
          path: src-tauri/gen/android/app/build/outputs/apk/**/**/*.apk
          if-no-files-found: error
  preview-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: [test, windows, android]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: '*preview', path: release-assets, merge-multiple: true}
      - name: Publish explicitly labeled development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0-preview.${{ github.run_number }}"
          find release-assets -type f \( -name '*.exe' -o -name '*.apk' \) -exec cp {} . \;
          gh release create "$TAG" ./*.exe ./*.apk --target "$GITHUB_SHA" --prerelease --title "无限记 $TAG 开发预览" --notes-file docs/PREVIEW-RELEASE.md
